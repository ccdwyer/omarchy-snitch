name: build-linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  musl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64)
        if: ${{ !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: ${{ matrix.cross }}
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --workspace --target ${{ matrix.target }}
          else
            cargo build --release --locked --workspace --target ${{ matrix.target }}
          fi

      - name: Checksums
        run: |
          mkdir -p dist
          t="${{ matrix.target }}"
          cp "target/${t}/release/snitchd" "dist/snitchd-${t}"
          cp "target/${t}/release/snitch-block" "dist/snitch-block-${t}"
          (cd dist && sha256sum "snitchd-${t}" "snitch-block-${t}" > "SHA256SUMS-${t}")
          cat dist/SHA256SUMS-${t}

      - uses: actions/upload-artifact@v4
        with:
          name: snitch-linux-${{ matrix.target }}
          path: dist/
