[package]
name = "snitchd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Unprivileged per-app outbound connection monitor for the Snitch Omarchy plugin"

[lib]
name = "snitchd"
path = "src/lib.rs"

[[bin]]
name = "snitchd"
path = "src/main.rs"

[dependencies]
maxminddb = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
