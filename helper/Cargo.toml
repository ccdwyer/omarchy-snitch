[package]
name = "snitch-block"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Privileged nftables/cgroup helper for Snitch. Invoked via pkexec."

[lib]
name = "snitch_block"
path = "src/lib.rs"

[[bin]]
name = "snitch-block"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
